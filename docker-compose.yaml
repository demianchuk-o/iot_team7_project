name: "road_vision_full_stack"

services:
  # 1. Message Broker
  mqtt:
    image: eclipse-mosquitto
    container_name: mqtt
    volumes:
      - ./deploy/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./deploy/mosquitto/data:/mosquitto/data
      - ./deploy/mosquitto/log:/mosquitto/log
    ports:
      - "1883:1883"
      - "9001:9001"
    networks:
      - main_network

  # 2. Database
  postgres_db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: road_state
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - main_network

  # 3. DB UI
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - main_network

  # 3a. Monitoring UI
  grafana:
    image: grafana/grafana:11.5.2
    container_name: grafana
    restart: always
    depends_on:
      - postgres_db
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - main_network

  # 4. Cache / Buffer
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - main_network

  # 5. Core API Service
  store:
    build:
      context: .
      dockerfile: store/Dockerfile
    container_name: store
    depends_on:
      - postgres_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASS: password
      POSTGRES_DB: road_state
      POSTGRES_HOST: postgres_db
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    networks:
      - main_network

  # 6. Aggregator & Logic Service
  hub:
    build:
      context: .
      dockerfile: hub/Dockerfile
    container_name: hub
    depends_on:
      - mqtt
      - redis
      - store
    environment:
      STORE_API_HOST: "store"
      STORE_API_PORT: 8000
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
      MQTT_BROKER_HOST: "mqtt"
      MQTT_BROKER_PORT: 1883
      BATCH_SIZE: 10
    ports:
      - "9000:8000"
    networks:
      - main_network

  # 7. Edge Logic
  edge:
    build:
      context: .
      dockerfile: edge/Dockerfile
    container_name: edge
    depends_on:
      - mqtt
    environment:
      MQTT_BROKER_HOST: "mqtt"
      MQTT_BROKER_PORT: 1883
      HUB_MQTT_BROKER_HOST: "mqtt"
      HUB_MQTT_BROKER_PORT: 1883
    networks:
      - main_network

  # 8. Data Generator (Agent)
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    container_name: agent
    depends_on:
      - mqtt
    environment:
      MQTT_BROKER_HOST: "mqtt"
      MQTT_BROKER_PORT: 1883
    networks:
      - main_network

networks:
  main_network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin-data:
  grafana_data:
